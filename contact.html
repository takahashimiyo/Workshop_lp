<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="inimu ワークショップへのお問い合わせページです。">
  <meta name="theme-color" content="#b22d35">
  <title>お問い合わせ｜inimu ワークショップ</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/contact.css">
  <script src="./js/contact.js" defer></script>
</head>
<body class="contact-page">
  <header class="contact-header">
    <a href="./index.html" aria-label="inimu トップページ"><img src="./assets/logo-white.webp" alt="inimu" width="220" height="48"></a>
    <a href="./index.html">トップページへ戻る</a>
  </header>
  <main class="contact-main">
    <div class="contact-intro">
      <p class="contact-eyebrow" lang="en">CONTACT</p>
      <h1>お問い合わせ</h1>
      <p>ワークショップについてのご質問など、<br class="contact-break">お気軽にお問い合わせください。</p>
    </div>
    <div class="contact-card">
      <p class="contact-notice">【架空サイト・デモ用フォーム】<br>このフォームはポートフォリオ用のデモです。実際のお問い合わせ・予約は受け付けておりません。個人情報は入力しないでください。</p>
      <form id="contact-form">
        <p class="contact-required-note"><span>必須</span> の項目をご入力ください。</p>
        <div class="contact-field">
          <label for="name">お名前 <span>必須</span></label>
          <input id="name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="contact-field">
          <label for="email">メールアドレス <span>必須</span></label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="contact-field">
          <label for="subject">お問い合わせの種類 <span>必須</span></label>
          <select id="subject" name="subject" required>
            <option value="" selected disabled>選択してください</option>
            <option>ワークショップについて</option>
            <option>ご予約について</option>
            <option>その他</option>
          </select>
        </div>
        <div class="contact-field">
          <label for="message">お問い合わせ内容 <span>必須</span></label>
          <textarea id="message" name="message" rows="7" required></textarea>
        </div>
        <button class="contact-submit" type="button" id="contact-demo">送信</button>
        <p class="contact-result" id="contact-result" role="status" tabindex="-1" hidden></p>
        <noscript><p class="contact-noscript">デモを試すにはJavaScriptを有効にしてください。</p></noscript>
      </form>
    </div>
    <a class="contact-back" href="./index.html">トップページへ戻る</a>
  </main>
  <footer class="contact-footer">
    <small>© inimu</small>
    <p>【架空サイト・職業訓練校制作実習作品】このサイトはポートフォリオとして制作した架空のWebサイトです。実在する企業・店舗・商品・サービスとは関係ありません。</p>
  </footer>
</body>
</html>
